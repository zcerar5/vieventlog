name: Build Docker Image

on:
  push:
    branches:
      - main
      - mqtt-homeassistant
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image archive
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: vieventlog-mqtt:latest
          outputs: type=docker,dest=/tmp/vieventlog-mqtt-linux-amd64.tar
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress Docker image archive
        run: gzip -9 /tmp/vieventlog-mqtt-linux-amd64.tar

      - name: Upload Docker image archive
        uses: actions/upload-artifact@v4
        with:
          name: vieventlog-mqtt-linux-amd64
          path: /tmp/vieventlog-mqtt-linux-amd64.tar.gz
          retention-days: 30
