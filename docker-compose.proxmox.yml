services:
  vieventlog:
    image: vieventlog-mqtt:latest
    container_name: vieventlog
    ports:
      - "5000:5000"
    volumes:
      - ./config:/config
    env_file:
      - .env.proxmox
    environment:
      BIND_ADDRESS: 0.0.0.0:5000
      VICARE_CONFIG_DIR: /config
      MQTT_ENABLED: "true"
      MQTT_BROKER: tcp://192.168.1.137:1883
      MQTT_CLIENT_ID: vieventlog
      MQTT_BASE_TOPIC: vieventlog
      MQTT_DISCOVERY_PREFIX: homeassistant
      MQTT_DISCOVERY: "true"
      MQTT_RETAIN: "true"
      MQTT_INTERVAL_SECONDS: "300"
    restart: unless-stopped
